# Continuous integration (bonus item 7c).
#
# On every push and pull request:
#   1. lint      - ruff checks code style and common bugs
#   2. test      - pytest on Python 3.10 / 3.12 / 3.13 (Linux) and 3.12 (Windows, macOS).
#                  The GUI test runs on Linux only, under a virtual display (xvfb).
#   3. benchmark - runs the algorithm comparison on a small sample and uploads the results
#                  (images + CSV) as a downloadable build artifact for the report.
#
# Algorithms that are still stubs are skipped (not failed), so the pipeline stays green
# while the team works on them.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Install virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run tests (Linux, with virtual display for the GUI test)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -v
      - name: Run tests (Windows/macOS, GUI test skipped)
        if: runner.os != 'Linux'
        env:
          SKIP_GUI_TESTS: "1"
        run: python -m pytest -v

  benchmark:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Compare algorithms on a small sample
        run: python -m seam_carving.benchmark compare samples/small_shapes.png --width 85% --out-dir results/ci
      - name: Scaling experiment (single seam, random energy maps)
        run: python -m seam_carving.benchmark scaling --sizes 16 32 64 --repeat 1 --csv results/ci/scaling.csv
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/ci/
          if-no-files-found: ignore
